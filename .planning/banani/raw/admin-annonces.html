<head>
  <meta charset="UTF-8" />
  <title>Habitat-Afrik — Gestion des annonces</title>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>

  <style id="base-styles">
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 812px;
      background: var(--background);
      color: var(--foreground);
      font-size: 14px;
    }
    .screen-wrap {
      min-height: 812px;
      display: flex;
      position: relative;
      overflow: hidden;
      background: var(--secondary);
    }
    .icon-wrap {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap.sm {
      width: 16px;
      height: 16px;
    }
    .icon-wrap.lg {
      width: 20px;
      height: 20px;
    }
  </style>

  <style id="sidebar-styles">
    .sidebar {
      width: 248px;
      min-width: 248px;
      background: var(--sidebar);
      color: var(--sidebar-foreground);
      border-right: 1px solid var(--border);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 4px 8px;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-lg);
      background: var(--sidebar-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--foreground);
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--muted-foreground);
      line-height: 1.2;
    }
    .country-switcher {
      background: var(--secondary);
      border-radius: var(--radius-xl);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .country-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .country-avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--card);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .country-label {
      font-size: 11px;
      color: var(--muted-foreground);
      margin-bottom: 2px;
    }
    .country-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-foreground);
      padding: 0 8px;
    }
    .country-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 8px;
    }
    .cpill {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--muted-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cpill.active {
      background: var(--sidebar-primary);
      color: var(--sidebar-primary-foreground);
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      background: transparent;
    }
    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .nav-item-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--sidebar-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item.active {
      background: var(--sidebar-primary);
    }
    .nav-item.active .nav-item-label {
      color: var(--sidebar-primary-foreground);
      font-weight: 600;
    }
    .nav-count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--muted-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .nav-item.active .nav-count {
      background: var(--card);
      color: var(--primary);
    }
    .sidebar-spacer {
      flex: 1;
    }
    .logout-item {
      background: #fef2f2;
    }
    .logout-item .nav-item-label {
      color: var(--destructive);
      font-weight: 600;
    }
  </style>

  <style id="topbar-styles">
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 76px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .searchbar {
      width: 420px;
      max-width: 100%;
      height: 44px;
      border-radius: 12px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      color: var(--muted-foreground);
    }
    .searchbar-text {
      font-size: 14px;
      color: var(--muted-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .notif-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--destructive);
    }
    .admin-pill {
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .admin-avatar {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .admin-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      white-space: nowrap;
    }
    .admin-role {
      font-size: 11px;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
  </style>

  <style id="page-styles">
    .page {
      flex: 1;
      min-width: 0;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-right: 508px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .page-title-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .page-eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }
    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--foreground);
      line-height: 1.2;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn.secondary {
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
    }
    .btn.success {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }
    .btn.danger {
      background: #fef2f2;
      color: var(--destructive);
      border: 1px solid #fecaca;
    }
    .status-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stab {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--foreground);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .stab.active {
      background: var(--sidebar-primary);
      color: var(--primary);
    }
    .stab-count {
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: inherit;
    }
    .stab.active .stab-count {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .filter-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      overflow: hidden;
    }
    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .filter-select {
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }
    .filter-reset {
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
  </style>

  <style id="table-styles">
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .bulk-bar {
      padding: 12px 16px;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .bulk-info {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
    }
    .bulk-spacer {
      flex: 1;
    }
    .table-toolbar {
      padding: 18px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .table-toolbar-left {
      font-size: 14px;
      font-weight: 700;
      color: var(--foreground);
    }
    .table-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .table-search {
      height: 36px;
      width: 220px;
      border-radius: 10px;
      background: var(--secondary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--muted-foreground);
      font-size: 13px;
      white-space: nowrap;
    }
    .col-heads,
    .table-row {
      display: grid;
      grid-template-columns:
        32px minmax(0, 2.7fr) minmax(124px, 1.1fr) minmax(120px, 1fr) minmax(104px, 0.95fr)
        minmax(108px, 0.95fr) 56px;
      gap: 12px;
      align-items: center;
      padding: 0 18px;
    }
    .col-heads > div,
    .table-row > div {
      min-width: 0;
    }
    .col-heads {
      height: 42px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: 0.02em;
    }
    .table-row {
      min-height: 68px;
      padding-top: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      color: var(--foreground);
      background: var(--card);
    }
    .table-row.selected {
      background: #f0f9ff;
    }
    .table-row.alt {
      background: #fcfdfe;
    }
    .table-row.alt.selected {
      background: #f0f9ff;
    }
    .checkbox-sim {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid #d1d5db;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .checkbox-sim.checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .table-annonce {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .table-annonce > div {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .annonce-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .annonce-ref {
      font-size: 11px;
      color: var(--muted-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .location-cell,
    .price-cell,
    .views-cell,
    .date-cell {
      width: 100%;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .location-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--secondary-foreground);
    }
    .price-cell {
      font-size: 13px;
      font-weight: 700;
      color: var(--foreground);
    }
    .views-cell,
    .date-cell {
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .txn-badge,
    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
    }
    .txn-vente {
      background: #eff6ff;
      color: var(--primary);
    }
    .txn-location {
      background: #f5f3ff;
      color: #7c3aed;
    }
    .badge-success {
      background: #f0fdf4;
      color: var(--success);
    }
    .badge-warning {
      background: #fffbeb;
      color: #d97706;
    }
    .badge-danger {
      background: #fef2f2;
      color: var(--destructive);
    }
    .badge-gray {
      background: #f3f4f6;
      color: #6b7280;
    }
    .badge-primary {
      background: #eff6ff;
      color: var(--primary);
    }
    .action-menu {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .action-mini {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pagination-bar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pagination-info {
      font-size: 13px;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .rows-select {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 13px;
      color: var(--foreground);
    }
    .pagination-pages {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ppage {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--secondary);
      color: var(--muted-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .ppage.active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
  </style>

  <style id="drawer-styles">
    .drawer-backdrop {
      position: absolute;
      top: 0;
      right: 0;
      width: 480px;
      height: 100%;
      background: var(--card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 5;
    }
    .drawer-header {
      height: 70px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--foreground);
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .drawer-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .drawer-annonce-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--foreground);
      line-height: 1.25;
    }
    .drawer-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      text-align: right;
    }
    .drawer-status {
      margin-top: 6px;
      text-align: right;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .info-item {
      background: var(--secondary);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .info-key {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted-foreground);
      margin-bottom: 6px;
    }
    .info-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }
    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 8px;
    }
    .description-text {
      font-size: 13px;
      line-height: 1.55;
      color: #374151;
    }
    .owner-card {
      background: var(--secondary);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .owner-avatar {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .owner-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 2px;
    }
    .owner-meta {
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .history-dot.active {
      background: var(--primary);
    }
    .history-text {
      font-size: 13px;
      line-height: 1.45;
      color: #374151;
    }
    .history-time {
      font-size: 11px;
      color: var(--muted-foreground);
      margin-top: 3px;
    }
    .drawer-actions {
      padding: 14px 18px 16px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-actions-row {
      display: flex;
      gap: 10px;
    }
    .reject-field {
      background: #fef2f2;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .reject-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--destructive);
      margin-bottom: 8px;
    }
    .reject-input {
      background: var(--card);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted-foreground);
      white-space: nowrap;
      overflow: hidden;
